
name: Deploy Cognitive Offloading Experiment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cognitive-offloading-experiment-webpage/package-lock.json

      - name: Install dependencies
        working-directory: ./cognitive-offloading-experiment-webpage
        run: npm ci

      - name: Build experiment
        working-directory: ./cognitive-offloading-experiment-webpage
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./cognitive-offloading-experiment-webpage/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
